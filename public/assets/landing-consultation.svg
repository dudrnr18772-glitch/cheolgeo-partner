<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="t d"><title id="t">폐업 점포 전체 철거와 원상복구 무료 상담</title><desc id="d">점포 주소와 업종, 철거 희망일을 알려주세요. 제휴 철거업체의 무료 상담 및 필요시 무료 방문견적을 안내합니다.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#123d2f"/><stop offset="1" stop-color="#2c7253"/></linearGradient><linearGradient id="f" x2="1"><stop stop-color="#dbe6d8"/><stop offset="1" stop-color="#f7f5e9"/></linearGradient></defs><rect width="1200" height="370" rx="15" fill="url(#b)"/><circle cx="1040" cy="-80" r="310" fill="#70b392" opacity=".14"/><path d="M718 370 1200 65V370Z" fill="#fff" opacity=".05"/><g transform="translate(790 45)"><rect x="0" y="0" width="335" height="272" rx="16" fill="#f7fbf4" opacity=".98"/><rect x="25" y="30" width="286" height="210" rx="6" fill="url(#f)"/><path d="M47 238V92L161 51 287 92v146" stroke="#8cac9b" stroke-width="11" fill="none"/><rect x="84" y="119" width="65" height="119" fill="#c1d5c4"/><rect x="185" y="119" width="75" height="80" fill="#d5e4d6"/><path d="M25 239H310" stroke="#96b7a1" stroke-width="6"/><path d="M25 239 0 270M310 239 335 270" stroke="#bed1c2" stroke-width="8"/></g><g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif"><rect x="59" y="51" width="150" height="35" rx="17.5" fill="#c7e9d1"/><text x="134" y="74" font-size="18" fill="#1f5d40" font-weight="bold" text-anchor="middle">철거파트너</text><text x="59" y="150" font-size="45" fill="white" font-weight="bold" letter-spacing="-2">폐업 점포 전체 철거 · 원상복구</text><text x="60" y="208" font-size="25" fill="#d7e9db">현장 범위와 인도 조건을 함께 확인하세요</text><rect x="59" y="245" width="305" height="75" rx="8" fill="#e2efdf"/><text x="211" y="292" font-size="26" fill="#174934" text-anchor="middle" font-weight="bold">무료 상담 문의  ↗</text><text x="389" y="285" font-size="18" fill="#bdd6c4">필요 시 무료 방문견적 · 제휴업체 상담</text></g></svg>